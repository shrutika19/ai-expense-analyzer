name: Backend CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: expense_analyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d expense_analyzer_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: src
      ENV_FILE: .env.test

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 4. Create test environment
      # ---------------------------------------------------------
      - name: Create test environment file
        run: |
          cat > .env.test <<'EOF'
          APP_NAME=AI Expense Analyzer
          APP_VERSION=0.1.0
          ENVIRONMENT=test
          DEBUG=false
          API_V1_PREFIX=/api/v1

          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=expense_analyzer_test
          DATABASE_USER=postgres
          DATABASE_PASSWORD=postgres

          JWT_SECRET_KEY=test-secret-key-for-ci
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
          JWT_ISSUER=ai-expense-analyzer
          JWT_AUDIENCE=ai-expense-analyzer-api

          MODEL_VERSION=v1.0.0
          MODEL_ARTIFACTS_DIRECTORY=artifacts/models
          EOF

      # ---------------------------------------------------------
      # 5. Verify application configuration
      # ---------------------------------------------------------
      - name: Verify application configuration
        run: |
          python - <<'PY'
          from expense_analyzer.core.config import get_settings

          settings = get_settings()

          print("Environment:", settings.environment)
          print("Database host:", settings.database_host)
          print("Database port:", settings.database_port)
          print("Database name:", settings.database_name)
          print("Database user:", settings.database_user)
          print("Model version:", settings.model_version)
          print(
              "Model artifacts directory:",
              settings.model_artifacts_directory,
          )
          PY

      # ---------------------------------------------------------
      # 6. Initialize database
      # ---------------------------------------------------------
      - name: Initialize database
        run: |
          python scripts/init_db.py

      # ---------------------------------------------------------
      # 7. Verify database schema
      # ---------------------------------------------------------
      - name: Verify database schema
        run: |
          python - <<'PY'
          from expense_analyzer.infrastructure.database.connection import get_connection

          with get_connection() as connection:
              with connection.cursor() as cursor:

                  cursor.execute(
                      "SELECT current_database(), current_user"
                  )
                  print("Database:", cursor.fetchone())

                  cursor.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                      ORDER BY table_name
                  """)

                  print("Tables:", cursor.fetchall())
          PY

      # ---------------------------------------------------------
      # 8. Seed deterministic ML dataset
      # ---------------------------------------------------------
      - name: Seed deterministic ML training dataset
        run: |
          python scripts/seed_ml_dataset.py

      # ---------------------------------------------------------
      # 9. Verify seeded database
      # ---------------------------------------------------------
      - name: Verify seeded database
        run: |
          python - <<'PY'
          from expense_analyzer.infrastructure.database.connection import get_connection

          with get_connection() as connection:
              with connection.cursor() as cursor:

                  cursor.execute(
                      "SELECT current_database(), current_user"
                  )
                  print("Database:", cursor.fetchone())

                  cursor.execute("SELECT COUNT(*) FROM users")
                  print("Users:", cursor.fetchone()[0])

                  cursor.execute("SELECT COUNT(*) FROM expenses")
                  print("Expenses:", cursor.fetchone()[0])

                  cursor.execute("""
                      SELECT category, COUNT(*)
                      FROM expenses
                      GROUP BY category
                      ORDER BY category
                  """)

                  print("Categories:", cursor.fetchall())
          PY

      # ---------------------------------------------------------
      # 10. Verify raw ML training dataset
      # ---------------------------------------------------------
      - name: Verify raw ML training dataset
        run: |
          python - <<'PY'
          from expense_analyzer.ml.datasets.loader import DatasetLoader

          dataframe = DatasetLoader().load()

          print(f"Loaded rows: {len(dataframe)}")
          print(dataframe["category"].value_counts().sort_index())

          assert not dataframe.empty, "ML dataset is empty"
          assert len(dataframe) == 50, (
              f"Expected 50 ML records, found {len(dataframe)}"
          )
          assert dataframe["category"].nunique() == 10, (
              "Expected 10 expense categories"
          )
          PY

      # ---------------------------------------------------------
      # 11. Verify cleaned ML dataset
      # ---------------------------------------------------------
      - name: Verify cleaned ML dataset
        run: |
          python - <<'PY'
          from expense_analyzer.ml.datasets.loader import DatasetLoader
          from expense_analyzer.ml.datasets.cleaner import DatasetCleaner

          dataframe = DatasetLoader().load()
          result = DatasetCleaner().clean(dataframe)

          cleaned_dataframe = result.dataframe

          print(f"Rows before cleaning: {len(dataframe)}")
          print(f"Rows after cleaning: {len(cleaned_dataframe)}")

          print("Categories after cleaning:")
          print(
              cleaned_dataframe["category"]
              .value_counts()
              .sort_index()
          )

          print("Removed records:", result.removed_count)

          assert not cleaned_dataframe.empty, (
              "ML dataset is empty after cleaning"
          )

          assert cleaned_dataframe["category"].nunique() == 10, (
              "Expected 10 expense categories after cleaning"
          )
          PY

      # ---------------------------------------------------------
      # 12. Publish ML model
      # ---------------------------------------------------------
      - name: Publish ML model
        run: |
          python -m expense_analyzer.ml.training.publish_model

      # ---------------------------------------------------------
      # 13. Verify ML model artifact
      # ---------------------------------------------------------
      - name: Verify ML model artifact
        run: |
          test -f artifacts/models/expense_category/v1.0.0/model.joblib
          test -f artifacts/models/expense_category/v1.0.0/metadata.json

          echo "ML model artifact is available"

          echo "Artifact files:"
          find artifacts/models/expense_category/v1.0.0 \
            -maxdepth 1 \
            -type f \
            -print

      # ---------------------------------------------------------
      # 14. Run backend tests
      # ---------------------------------------------------------
      - name: Run backend tests
        run: |
          pytest -v
