name: Backend CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expense_analyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d expense_analyzer_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: src
      ENV_FILE: .env.test

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 4. Create test environment file
      # ---------------------------------------------------------
      - name: Create test environment file
        run: |
          cat > .env.test <<'EOF'
          APP_NAME=AI Expense Analyzer
          APP_VERSION=0.1.0
          ENVIRONMENT=test
          DEBUG=false
          API_V1_PREFIX=/api/v1

          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=expense_analyzer_test
          DATABASE_USER=postgres
          DATABASE_PASSWORD=postgres

          JWT_SECRET_KEY=test-secret-key-for-ci
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
          JWT_ISSUER=ai-expense-analyzer
          JWT_AUDIENCE=ai-expense-analyzer-api
          EOF

      # ---------------------------------------------------------
      # 5. Generate and publish ML model
      # ---------------------------------------------------------
      - name: Publish ML model
        run: |
          python -m expense_analyzer.ml.training.publish_model

      # ---------------------------------------------------------
      # 6. Verify ML model artifact
      # ---------------------------------------------------------
      - name: Verify ML model artifact
        run: |
          test -f artifacts/models/expense_category/v1.0.0/model.joblib
          test -f artifacts/models/expense_category/v1.0.0/metadata.json
          echo "ML model artifact is available"

      # ---------------------------------------------------------
      # 7. Initialize database
      # ---------------------------------------------------------
      - name: Initialize database
        run: |
          python scripts/init_db.py

      # ---------------------------------------------------------
      # 8. Run tests
      # ---------------------------------------------------------
      - name: Run tests
        run: |
          pytest -v
